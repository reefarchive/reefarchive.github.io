project:
  type: website
  output-dir: _site
  post-render: fix_index_links.R

resources:
  - _img/*

website:
  title: "The Reef Archive"
  description: "An archive of historical coral reef photography"
  repo-url: https://github.com/reefarchive/reefarchive.github.io
  site-url: https://reefarchive.org
  favicon: _img/favicon.png
  open-graph:
    title: The Reef Archive
    description: An archive of historical coral reef photography
    image: _img/hero.jpg
    locale: en_GB
  
  navbar:
    pinned: true
    background: "#0D1B2A"
    foreground: "#F7F4EE"
    favicon: _img/favicon.png
    search: false
    right:
      - text: "About"
        menu: 
          - text: "Reef Archive"
            href: about/about
          - text: "Data Standards"
            href: about/standards
          - text: "Contribute"
            href: about/contribute
      - text: "Collections"
        href: collections
      - text: "Atlas"
        href: atlas
      - icon: envelope-fill
        href: mailto:info@reefarchive.org
        aria-label: Contact
      - icon: archive-fill
        href: https://zenodo.org/communities/reefarchive
        aria-label: Zenodo
      - icon: github
        href: https://github.com/reefarchive/reefarchive.github.io
        aria-label: GitHub

  page-footer:
    background: "#0D1B2A"
    foreground: "#C8B89A"
    left: |
      A living record of historical coral reef photography
    center: |
      [Contact us](mailto:info@reefarchive.org)
    right: |
      [Built with Quarto](https://quarto.org) · [Media archived via Zenodo](https://zenodo.org/communities/reefarchive)

format:
  html:
    theme:
      - cosmo
      - styles/custom.scss
    css: styles/custom.css
    toc: false
    smooth-scroll: true
    link-external-newwindow: false
